<script>
const STANDALONE=!!window.BULLSEYE_STANDALONE;
const SHARE_URL=STANDALONE?location.href.split(/[?#]/)[0]:'https://claude.ai/artifact/JxreVy1byU5LApU2x7NsDw';
const CHANGELOG=[
{n:76,date:'Nov 24, 2026',title:'Installable app you can host anywhere',items:[
'The tool can now be installed as an app (a PWA) on a computer or phone, and it works offline once it has loaded.',
'Outside Claude, projects are saved in this browser on this device. Use Back up data in the side menu to save a copy, and Restore from backup to bring it to another device or browser.',
'PDF export downloads the file directly. The PDF library and the fonts ship with the app, so nothing loads from other sites.',
'When a new version is published, a message offers to reload into it.']},
{n:75,date:'Nov 23, 2026',title:'Prototype banner',items:[
'Added a red Prototype label at the right end of the header bar, on every page, so anyone using the tool knows it is still a prototype. Hovering over it explains that things may change and some parts are unfinished.']},
{n:74,date:'Nov 23, 2026',title:'Everyone gets their own private workspace',items:[
'The tool now saves every person’s projects, epics, features, items, and drafts in a private area that belongs to them alone. Send the same link to anyone and each person starts with their own empty workspace. Nobody else can see it, including the owner.',
'Because projects are private, the Share this project step is gone from creating a project (now two steps), and the project settings page has a Link to the tool field you can copy and send instead.',
'Bug reports and suggestions still reach you: they go into a separate box that anyone can add to but only you and editors can read. The Feedback inbox is unchanged for you, except Delete now hides a report from your inbox instead of erasing it.',
'People need Contributor access to save anything. Anyone with view-only access sees the home page with a note explaining that, and can’t create projects.']},
{n:73,date:'Nov 23, 2026',title:'Bug report and Suggestions buttons',items:[
'The side menu now has Bug report and Suggestions buttons, in the bottom section next to the Changelog. Each opens a short form: for a bug, what happened and what you expected; for a suggestion, your idea and how it would help. Both also take an optional name or email for a reply.',
'Each report is saved with the screen it was sent from (the page, and the project, epic, and feature you were on), your window size, and the version of the tool, so it is easier to reproduce.',
'The owner and editors also get a Feedback inbox in the same section. It lists every report newest first, with filters for All, Open, Bugs, and Suggestions, and buttons to mark one done, reopen it, or delete it. Everyone else only sees the two buttons.',
'People with view-only access can open the forms but can’t send them, because view-only access can’t save anything. Sending requires access that allows saving.']},
{n:72,date:'Nov 22, 2026',title:'Export a whole epic to PDF',items:[
'The epic page now has an Export PDF button. The PDF opens with a cover page for the epic, then gives every Bullseye map in the epic its full breakdown, exactly as its own PDF does.',
'The cover page has the epic’s name, owner, and Definition of Done, a progress bar with how many features are complete, an at-a-glance summary (must-haves done, nice-to-haves, cut items, hours, and subtasks across all maps), and a table of every map with its tag, owner, must-haves done, nice-to-haves, hours, whether its MVP is complete, and the page where it starts.',
'After the cover, each map gets its map page and its full item breakdown: every item with hours, assignee, who needs to know, status, subtasks, dependencies, and Definition of Done, plus any cut items. The footer numbers every page of the whole document.']},
{n:71,date:'Nov 22, 2026',title:'The epic progress bar counts features',items:[
'The epic progress bar now counts features (Bullseye maps) instead of must-haves. It shows how many of the epic’s features are complete, for example “2 of 3 features complete,” with a percentage.',
'A feature is complete when its MVP is complete: every one of its must-haves is done. A must-have counts as done when it is marked Done or all of its subtasks are done. A feature with a must-have still open is not counted, and an epic with no features yet says so.']},
{n:70,date:'Nov 22, 2026',title:'Epics show a progress bar',items:[
'Each epic now has a progress bar showing how complete all of its Bullseye maps are, with the count underneath, for example “3 of 8 must-haves done across all maps” and a percentage. It appears on the epic’s box on the project page and under the description on the epic page.',
'It uses the same measure as each feature’s own bar, the share of must-haves that are done, added up across every map in the epic. A must-have counts as done when it is marked Done or when all of its subtasks are done. An epic with no must-haves yet says so.']},
{n:69,date:'Nov 22, 2026',title:'Epic boxes hold the real feature rectangles, and the epic page is a description',items:[
'On the project page, each epic box now contains the actual feature rectangles, the same cards you see on the project and epic pages, just a little smaller, with each feature’s name, tag, owner, progress, and hours. Click a feature inside the box to open its map, or click the rest of the box to open the epic.',
'Opening an epic now shows a read-only description (its owner and Definition of Done) with all of its features listed below as rectangles, instead of the edit form.',
'Editing moved behind an Edit epic button. It shows the edit form, with Done editing to go back and Delete this epic with its confirmation.']},
{n:68,date:'Nov 22, 2026',title:'Epics are back, as boxes that hold Bullseye maps',items:[
'A new Create Epic button on the project page opens a short form: Feature Name, Owner, and Definition of Done. Creating it puts a rectangular box for the epic on the project page, under an Epics heading.',
'Click the box to open the epic. From there, Add Feature starts the usual walkthrough, and every map you make is kept inside that epic. The box on the project page lists its maps and counts them.',
'Maps inside an epic only relate to that epic: they appear only there, their dependencies can only point at other maps in the same epic, their breadcrumbs and PDF show the epic, and drafts you save while making one come back inside the epic.',
'On the epic page you can edit its name, owner, and Definition of Done, and delete the epic, which deletes its maps after you confirm. Features you add from the project page stay outside any epic, as before.']},
{n:67,date:'Nov 22, 2026',title:'Steps 2 and 3 list the fields you will fill in',items:[
'Step 2 now has a “You’ll fill in for each must-have” list: Name, Definition of Done, Status, Estimated hours, Assigned to, and Needs to be in the know, each with a one-line hint taken from the tool.',
'Step 3 has the same kind of list for each nice-to-have: the same details as a must-have, plus ordering them by dragging, with number 1 closest to the must-haves and the highest number cut first.',
'Steps 1, 2, and 3 now all have one, in the same style.']},
{n:66,date:'Nov 22, 2026',title:'Step 1 now lists the fields you will fill in',items:[
'Under the step 1 description there is now a short “You’ll fill in” list: Feature, Identity Tag, Definition of Done, and Feature Owner, each with a one-line hint taken from the tool itself. It is plain text, not a form, so it reads as an example of what you’ll be asked.',
'Steps 2 and 3 do not have one yet; this is the trial version to judge how it looks.']},
{n:65,date:'Nov 22, 2026',title:'All pulses reach the edge in 2.5 seconds',items:[
'The pulses were running at different speeds: the Feature bullseye in step 1 was the fastest and the full map in step 3 the slowest. All four now take exactly 2.5 seconds to travel from the center to the edge, and all four repeat every 3.5 seconds (2.5 seconds of travel and a one-second rest).',
'The soft fades are tied to their pulse, so the header map, the Feature bullseye, the Must Have circle, and the Nice to Have circle were retimed with them and still appear right behind the pulse.']},
{n:64,date:'Nov 22, 2026',title:'Diagrams reset when you move off them',items:[
'Each diagram (the header map and steps 1, 2, and 3) now resets once it is completely off screen and plays again from the start when you scroll back to it. This replaces the earlier play-once behavior.',
'Each one starts as soon as a tenth of it is on screen, and it only resets when none of it is, so a diagram never flickers or restarts while it sits at the edge of the window, and you don’t see a half-built diagram while scrolling.']},
{n:63,date:'Nov 22, 2026',title:'The header map and the Feature bullseye now fade in with the pulse',items:[
'The map at the top of the home page now builds itself: the pulse starts in the middle, the red Feature bullseye fades in around it, then the Must Have circle, then the Nice to Have circle, each with its words, easing in softly behind the pulse. Once it is built it stays, and the pulse keeps repeating.',
'The red Feature bullseye in step 1 fades in the same way when that section scrolls into view.',
'These two fades use a fixed-size cover instead of a growing one, so there is no oversized shape, and they start in sync with their pulse. With reduced motion, both diagrams simply show.']},
{n:62,date:'Nov 21, 2026',title:'Fixed: words moving off the screen when the map animates',items:[
'Fixed a glitch where the words on the map could appear to be swept off the screen while the Must Have and Nice to Have circles faded in.',
'The soft fade that wipes each circle in used a very large hidden shape, nearly 7,000 pixels wide at its biggest, which some screens and browsers can’t draw cleanly. It is now a fraction of that size, and anything drawn outside the diagram is cut off.',
'The pulses and the fade now scale from the exact center of their own circle rather than from a fixed pixel position, which browsers handle more consistently.']},
{n:61,date:'Nov 21, 2026',title:'Fixed: diagrams no longer reset when you scroll back up',items:[
'Fixed a glitch where scrolling back up past step 2 or step 3 reset the diagram to its starting state, so the Must Have circle or the green ring was missing again while the diagram came back into view.',
'Each diagram now plays its reveal once, the first time it is about a quarter on screen, and then stays complete, with the pulse still repeating. It no longer waits until half the diagram is showing.']},
{n:60,date:'Nov 21, 2026',title:'Step 3: the Nice to Have circle fades in behind the pulse',items:[
'Step 3 now builds on step 2. The Feature and the Must Have circle are already in place, and when the diagram scrolls into view the pulse fades the green Nice to Have circle in softly behind it as it moves outward, with its eight slices and labels easing into view.',
'The pulse keeps its three colors: red in the bullseye, yellow in the Must-Haves, green in the Nice-to-Haves. Scroll away and back to replay it. With reduced motion the full diagram simply shows.']},
{n:59,date:'Nov 21, 2026',title:'Soft fade as the Must Have circle appears',items:[
'The Must Have circle in step 2 no longer pops in along a hard edge. It now fades in softly in a band that trails behind the pulse, so every slice and label eases into view as the pulse passes over it.',
'The soft band finishes after the pulse has faded, so the circle is fully solid by the time the pulse rests.']},
{n:58,date:'Nov 21, 2026',title:'Step 2: the Must Have circle appears as the pulse passes',items:[
'In step 2, only the red Feature shows at first. When the diagram scrolls into view, the pulse starts and the yellow Must Have circle, with its four slices and labels, appears right behind the pulse as it moves outward.',
'Once the circle is revealed it stays, and the pulse keeps repeating over it. Scroll away and back and the reveal plays again.',
'If your device is set to reduce motion, the full diagram simply shows with no animation.']},
{n:57,date:'Nov 21, 2026',title:'Third how-it-works section: the Nice-to-Haves',items:[
'Added step 3 below the Must-Haves. It shows the full Bullseye map: the Feature in the center, the four Must Haves around it, and eight Nice to Haves on the outside, with a single pulse that is red in the bullseye, yellow in the Must-Haves, and green in the Nice-to-Haves.',
'The text explains how nice-to-haves turn a working feature into a more engaging, polished one, and why identifying them separately keeps the team from delaying the MVP.',
'The text is back on the left and the diagram on the right, so steps 1 to 3 alternate down the page.']},
{n:56,date:'Nov 21, 2026',title:'Step 2 description rewritten',items:[
'Rewrote the step 2 description. It now opens with what must-haves are and why defining them keeps development focused, then asks you to identify the essentials needed to make the feature playable, testable, and ready for MVP evaluation.']},
{n:55,date:'Nov 21, 2026',title:'New description for the Must-Haves section',items:[
'Replaced the description in step 2 with two paragraphs: one on identifying the essentials that make the feature playable, testable, and ready for MVP evaluation, and one on how defining the must-haves prevents feature creep and keeps development focused.']},
{n:54,date:'Nov 21, 2026',title:'Second how-it-works section: the Must-Haves',items:[
'Added step 2 below the feature section. It shows the red Feature bullseye with its four Must Have slices around it, and a single pulse that starts red in the middle and turns yellow as it crosses into the Must-Haves.',
'The text explains that must-haves are everything that has to be completed for the feature to reach a testable minimum viable product.',
'The diagram sits on the left and the text on the right, flipping the layout of step 1 so the page alternates as you scroll. On a phone the text always comes first.']},
{n:53,date:'Nov 21, 2026',title:'Removed the background behind the Feature bullseye',items:[
'Removed the grey rounded box behind the red Feature bullseye in the first how-it-works section, so the bullseye and its pulse sit directly on the page.']},
{n:52,date:'Nov 21, 2026',title:'First how-it-works section: the feature',items:[
'Added the first section below the top of the home page. It shows just the red Feature bullseye, with a single red pulse traveling out from its center, next to the explanation of what a game feature is and why you name it first.',
'The Learn how it works button now scrolls to this section.',
'The top section still fills the whole first screen; the new section begins right below it.']},
{n:51,date:'Nov 21, 2026',title:'Learn how it works button',items:[
'Added a Learn how it works button next to Try it here on the home page. It’s the lighter, outlined button, and it will scroll to the first how-it-works section below the top of the page once that section exists. Until then it shows a short message instead.',
'It stays available for people who can only view; only Try it here is greyed out for them.']},
{n:50,date:'Nov 21, 2026',title:'Removed the caption under the map',items:[
'Removed the line “A blank Bullseye map: one feature, 4 must-haves, and 8 nice-to-haves, ready to fill in.” from under the map on the home page. The map keeps its size on most screens, and gets a little more room on short windows.']},
{n:49,date:'Nov 21, 2026',title:'Removed the logo and tag above the headline',items:[
'Removed the small Bullseye Method logo and name that sat above the “Keep Your Scope on Target.” headline on the home page. The logo and name are still in the header at the top.']},
{n:48,date:'Nov 21, 2026',title:'New home page headline',items:[
'The headline at the top of the home page now reads “Keep Your Scope on Target.” and the line under it reads “Visualize the MoSCoW Framework to cut the noise and focus on what makes your game fun.”']},
{n:47,date:'Nov 21, 2026',title:'Faster startup',items:[
'The home screen now appears as soon as the page opens instead of waiting for your projects to load. Try it here switches on once your data and permissions are ready.',
'The PDF library (the biggest download, bigger than the whole tool) is no longer fetched when the page opens. It loads in the background when you open a map, or when you press Export PDF if it isn’t there yet.',
'The fonts no longer hold up the first paint, and the permission checks and data requests now run side by side instead of one after another.']},
{n:46,date:'Nov 21, 2026',title:'Edit in the same form you add with',items:[
'In the walkthrough, clicking Edit on a must-have or nice-to-have now loads it into the same form you add items with, at the top, instead of opening a second editor card in the list. The form says Editing and its code, and its buttons become Save changes and Cancel.',
'The item being edited is marked in the list. If you were in the middle of adding something new, it’s put aside and comes back after you save or cancel.',
'Next is held until you save or cancel, Save progress remembers an edit in progress, and removing items while editing keeps the right one selected.']},
{n:45,date:'Nov 21, 2026',title:'Home page trimmed to the top section',items:[
'Everything below the Try it here section was removed: Why teams need it, the idea, the six how-to steps with their screenshots, the interactive cut-line demo, and the PDF examples.',
'The home page is now one screen: the headline, the Try it here button, and the pulsing blank Bullseye map, which fills the window.']},
{n:44,date:'Nov 21, 2026',title:'Home page uses the whole screen',items:[
'On large and full-screen displays the home page content used to stop at a fixed width, leaving wide empty bands on both sides. It now grows with the screen: a wider content area, a bigger headline and body text, a larger map at the top, and larger screenshots.',
'On a big screen the top section fills the window, so the headline, button, and map are all in view without scrolling.',
'Laptop and phone layouts are unchanged.']},
{n:43,date:'Nov 21, 2026',title:'Changelog moved to the bottom of the side bar',items:[
'The Changelog now sits at the bottom of the side bar, under a divider, and stays pinned there even when the list of projects is long. Business and developer items will live in that bottom section.']},
{n:42,date:'Nov 21, 2026',title:'Your Projects only shows once you have projects',items:[
'In the side bar menu, the Your Projects section now appears only after you’ve made a project, and then it lists them. With none, the menu is just Create Project and Changelog.']},
{n:41,date:'Nov 21, 2026',title:'The menu is now a side bar',items:[
'The three-line button now opens a full-height side bar that slides in from the left over a dimmed page, like the menus on YouTube and Claude. It has the Bullseye Method logo and a close button at the top, then Your Projects, Create Project, and Changelog.',
'Click the dimmed area, press Escape, use the close button, or pick an item to close it. The page behind it doesn’t scroll while the side bar is open, Tab stays inside it, and the arrow keys move through the items.',
'On a phone the side bar takes up most of the width. If your device is set to reduce motion, it appears without sliding.']},
{n:40,date:'Nov 21, 2026',title:'Menu button in the header',items:[
'A three-line menu button now sits at the far left of the header, to the left of Bullseye Method. It holds Your Projects (with each project and its feature count), Create Project, and Changelog.',
'The Your Projects, Create Project, and Changelog buttons are gone from the right side of the header. The menu is on every page, not just the home page.',
'The menu marks the project and page you’re on. Create Project is greyed out for people who can only view and while projects are still loading. Escape or a click elsewhere closes it, and the arrow keys move through it.']},
{n:39,date:'Nov 21, 2026',title:'Home page top: a blank map with a pulse',items:[
'The map at the top is now a blank Bullseye map: one Feature in the bullseye, four Must Have slices in the inner circle, and eight Nice to Have slices in the outer circle, each labeled as what it is.',
'A single pulse travels out from the middle of the bullseye over and over: red inside the bullseye, yellow once it crosses into the must-haves, and green once it crosses into the nice-to-haves. There is only ever one on the map at a time, and it stays off if your device is set to reduce motion.',
'The See how it works button is now Try it here and starts a new project. It is greyed out for people who can only view.',
'Fixed a layout mistake from update 35: a stray closing tag made everything below the top of the home page lose its intended styling, such as the large section headings and spacing.']},
{n:38,date:'Nov 21, 2026',title:'Spinning map removed',items:[
'The big, slowly turning map at the top of the home page (update 37) was taken out. The top of the page is back to the regular-sized real Melee Combat map, as it was in update 35.',
'Also fixed: the Your Projects menu is greyed out until your projects have loaded, so it can no longer say “No projects yet” by mistake while the page is still loading.']},
{n:37,date:'Nov 21, 2026',title:'Home page top: a big, slowly turning map',items:[
'The map at the top of the home page was made bigger and placed half off the right edge of the screen.',
'The rings turned slowly while the bullseye in the middle stayed put. Removed again in update 38.']},
{n:36,date:'Nov 21, 2026',title:'“Requirements” are now “must-haves”',items:[
'Everywhere the tool said requirements it now says must-haves: the walkthrough (step 2 is now Feature MVP Must-Haves), the Add must-have button, the map pills and legend, the item panel, the ordering screen, the cut messages, project tiles, the PDF, and the home page.',
'Nothing about how it works changed, and item codes like MCOM-1 stay the same. Earlier entries in this Changelog keep the wording they had at the time.']},
{n:35,date:'Nov 21, 2026',title:'Home page: your real map up top, Your Projects in the header',items:[
'The top of the home page now shows a pre-made Bullseye map built from the Melee Combat feature in your GAME 1 project: eight requirements in the middle and eight nice-to-haves around them. It’s a snapshot, so it looks the same for everyone and doesn’t change when you edit the project.',
'The Try me bullseye button is gone. Create Project in the header bar is how you start.',
'Your projects moved into the header: a Your Projects menu sits next to Create Project, shows how many projects you have, and lists each one with its feature count. Click one to open it. Escape or a click elsewhere closes the menu, and the arrow keys move through it.',
'The Your projects section on the home page itself is removed.']},
{n:34,date:'Nov 21, 2026',title:'The pitch is now the home page',items:[
'The first screen is now the pitch: what the method is, why teams need it, and six steps showing how to use it with real screens from the tool, refreshed to match the current version.',
'The bullseye in the top corner is a Try me button. Click it to create a project. It pulses gently, and it’s disabled for people who can only view.',
'Your projects appear right under the top section once you have some, so getting back to your work is still one click.',
'The cut line demo on the page is interactive. The Create Project button in the header still works as before.']},
{n:33,date:'Nov 21, 2026',title:'Removed “Make this its own feature”',items:[
'Removed the Make this its own feature button from the item panel. The tool exists to keep scope focused, so an item stays an item: if it needs breaking down, it gets subtasks.',
'Maps that were already split off this way still work, and the item keeps a link to open its map.']},
{n:32,date:'Nov 21, 2026',title:'Item panel built for sprint planning',items:[
'The item panel now follows how a planning meeting runs: the item’s name, a progress summary, its Definition of Done, then the Subtasks, where each developer tracks their own work.',
'A progress bar at the top shows how many subtasks are done, the item’s status, and its total hours. An item with no subtasks shows its own status and hours instead.',
'Adding a subtask takes the name, who it’s for, and the hours in one go, and pressing Enter in any of them adds it. The dependency dropdown is right there too.',
'People, Design document, and Definition of Done each have a clear heading. Move, Move to nice to have, Make this its own feature, and Delete are tucked under More actions, which opens by itself when you ask to delete.',
'This works the same for requirements and nice-to-haves, since both are features in their own right.']},
{n:31,date:'Nov 21, 2026',title:'Friendlier everywhere',items:[
'Phones: the header fits on one line, form fields and buttons are bigger to tap, and in Add Feature the form now comes before the preview circle instead of below it.',
'Messages: errors appear next to the field that needs fixing, the field is highlighted and focused, and the message clears as you type. Pop-up messages now sit at the bottom so they never cover the header, and they stay a little longer.',
'The walkthrough has a progress bar, and pressing Enter in any field of the add form adds the item. Duplicate “0 added” and “Nothing added yet” lines and a repeated instruction on the map step are gone.',
'The first screen now explains the method in three short lines.',
'The map shows a quiet Saved note after each change. The Definition of Done count is a plain note instead of an orange warning, and the always-true “One main feature” pill is gone.',
'Wording is consistent: it is just “the feature” everywhere, including the map, project tiles, and the PDF. Tiles show the feature’s owner. The settings page spells out GDD (Game Design Document).',
'If something fails to save, the message now says nothing changed and what to try.']},
{n:30,date:'Nov 21, 2026',title:'Dependencies restarted: subtasks only',items:[
'Dependencies now work one way: every subtask has an Add a dependency dropdown that lists only other subtasks. A dependency is another subtask that must be finished before this one can continue.',
'The dropdown is on each subtask in the item panel, and also on the box where you create a subtask, so a new subtask can start with one. Pick more at any time and remove them with the ×.',
'Removed the earlier design: the final dependencies step, the Dependencies screen and its button, dependencies on whole items, and the worked-out “from its subtasks” views. The walkthrough is back to five steps.',
'Kept: loops are blocked, the cut warning lists subtasks that depend on something you are about to cut, and the PDF’s Depends on column shows each subtask’s dependencies.',
'Links set earlier on whole items are ignored. Subtask-to-subtask links from before still work.']},
{n:29,date:'Nov 21, 2026',title:'Edit dependencies from the map',items:[
'The item panel now has a Depends on section. For an item with no subtasks you can add and remove its dependencies right there. For an item with subtasks, it shows the worked-out dependencies, and each subtask has its own Depends on list with the same controls.',
'The Dependencies button moved to the top of the map, next to Export PDF, so it is easy to find. It opens the full screen with every item at once.',
'Changes save immediately, and the same checks apply: no loops, and the cut warning still uses what you set.']},
{n:28,date:'Nov 21, 2026',title:'Dependencies now live on subtasks',items:[
'Dependencies are marked on the smallest pieces of work: a subtask, or an item that has no subtasks. A dependency can only point at another subtask (or an item with none), so there are no vague links to whole items.',
'Everything above is worked out for you. An item depends on whatever its subtasks depend on, and the bullseye is the MVP: it is done when its requirements are done. Nice-to-haves are never something the bullseye waits on.',
'The final step is now “break items into subtasks, then mark what depends on what”. Each item has a quick Add subtask box. The first subtask keeps the item’s hours, status, and any dependencies, so nothing is lost when you split it.',
'The step shows the MVP at the top: how many requirements are done, whether it is complete, and any other feature the MVP waits on. The map shows the same MVP count and a pill, and the bullseye panel says MVP complete once every requirement is done.',
'The PDF’s Depends on column shows each item’s worked-out dependencies, subtasks show their own, and the bullseye row reads All requirements plus any other feature the MVP waits on.',
'The cut warning now checks the subtask-level links.']},
{n:27,date:'Nov 21, 2026',title:'Dependencies',items:[
'New final step in the walkthrough, Step 6 of 6: Mark dependencies. It appears right after Add Bullseye Map saves the feature, and you can skip it.',
'A dependency can link an item to another item in the same feature, an item in a different feature, or a subtask, and a subtask can depend on another subtask. Pick from a list under each item, and remove with the ×.',
'The tool blocks loops, such as A depending on B while B already depends on A, and an item depending on itself or its own subtasks.',
'Before you cut something that other items depend on, the cut line shows a Heads up with the broken dependencies, and the confirmation button changes to Cut anyway. It also checks items in other features.',
'The PDF breakdown has a new Depends on column, and At a glance shows the number of dependencies.',
'Nothing changes on the circle. Reopen the screen any time from the Dependencies button on the map.']},
{n:26,date:'Nov 20, 2026',title:'Cleaner view for read-only visitors',items:[
'People who can only view or comment now see Create Project and Resume (on drafts) disabled, instead of buttons that fail after they try.',
'Everything else already behaved correctly for them: the Read-only badge, disabled editing controls, the what-if cut line, and PDF export.']},
{n:25,date:'Nov 20, 2026',title:'Warning before leaving unsaved work',items:[
'If you leave Add Feature with changes that aren’t saved, a prompt now asks whether to Save and leave, Leave without saving, or Keep editing. It covers the breadcrumb, the header links, and Cancel on step 1.',
'The prompt doesn’t appear when everything is saved, when nothing has been entered yet, or when you open the Changelog (Back returns you to the same place).',
'Closing or refreshing the browser tab while changes are unsaved shows the browser’s own “leave site?” warning. The wording is the browser’s, and some browsers or views may not show it.',
'Finishing with Add Bullseye Map never triggers the warning.']},
{n:24,date:'Nov 20, 2026',title:'Save progress in the walkthrough',items:[
'Every step of Add Feature now has a Save progress button, with a note beside it that says Not saved yet, Saved at a time, or Unsaved changes.',
'Saving keeps everything you’ve entered so far, including a requirement or nice-to-have you’re still typing, and the step you’re on.',
'Saved drafts appear in a Drafts section on the project page, with a Resume button and a Delete button (with confirmation). Resuming puts you back on the step you saved, with everything in place.',
'Saving again updates the same draft. Finishing with Add Bullseye Map removes its draft.',
'Drafts are shared with everyone on the project, like everything else in the tool.']},
{n:23,date:'Nov 20, 2026',title:'Walkthrough trimmed to five steps',items:[
'Removed the two review steps (review requirements and review nice-to-haves). They repeated what the add forms already collect, so the walkthrough goes from seven steps to five.',
'The five steps are now: the feature, the MVP requirements, the nice-to-haves, ordering the nice-to-haves, and the Bullseye map.',
'Nothing is lost: every added item still has an Edit button that opens its full details, and you can still click any slice on the map step to change it before adding the map.',
'The ordering step is still skipped when there are fewer than two nice-to-haves.']},
{n:22,date:'Nov 20, 2026',title:'Make this the cut',items:[
'The cut line is still a private what-if: sliding it on the map or dragging it on the ordering screen changes nothing for anyone else.',
'New Make this the cut button appears when the cut line is set. It asks for confirmation, then marks those nice-to-haves as cut for everyone on the team, with the date.',
'Cut items stay on the map but are faded and struck through, they no longer count toward the nice-to-have hours, and the slider only covers the items still kept.',
'Select a cut item to see when it was cut and a Restore to the map button. The ordering screen lists cut items in their own section with a Restore button too.',
'The PDF shows cut items struck through on the map, a Cut line in At a glance, and a separate Cut section in the breakdown that isn’t counted in the totals.']},
{n:21,date:'Nov 20, 2026',title:'Step 4 wording',items:[
'Step 4 (Nice to Have Features) now says to add each one with its details, in any order, and that the next step lets you drag them into order, closest to the core feature first. It no longer asks you to type them in cut order.']},
{n:20,date:'Nov 20, 2026',title:'Drag-and-drop ordering for nice-to-haves',items:[
'New ordering screen: the requirements sit fixed at the top as the core feature, and the nice-to-haves are cards below it that you drag up (closer to the requirements) or down (further away).',
'Number 1 is the closest to the requirements. The numbers update live as you drag.',
'A draggable cut line sits in the list. Everything below it is cut, and it shows the hours that frees. The map’s cut line picks up the same position.',
'Works with a mouse, with touch, and with the up and down arrow keys on a card’s handle.',
'In the walkthrough it is a new step after Nice to Have Features (now step 5 of 7), and it is skipped when there are fewer than two nice-to-haves. On the map, use the Order nice-to-haves button under the cut line.',
'Item codes (like MCOM-8) now stay with the item when it is reordered, in the walkthrough as well as on the map.']},
{n:19,date:'Nov 20, 2026',title:'Cut order corrected: closest to the requirements',items:[
'Nice to have items are numbered 1 at the top to the highest number at the bottom. Number 1 is the closest to the requirements.',
'The cut line now starts at the bottom (the highest number, furthest from the core feature) and moves up toward the requirements.',
'This replaces the count-down numbering from update 17. Labels now read “#2 of 4” instead of “cut 2”, in the item panel, the walkthrough review steps, and the PDF.',
'The Step 4 description now says to add items from closest to the core feature to furthest.']},
{n:18,date:'Nov 20, 2026',title:'Fix: item edits on the map now save',items:[
'Fixed a bug where edits made in the item panel on a Bullseye map (name, Definition of Done, status, hours, assigned to, needs to be in the know, GDD link, subtasks, moving, and deleting) were not saving.',
'The walkthrough, the bullseye panel, settings, and the PDF export were not affected.']},
{n:17,date:'Nov 20, 2026',title:'Cut numbers now count down',items:[
'Nice to have items are now numbered from the highest number down: the highest number is cut first and 1 is cut last.',
'Applied to the PDF breakdown (including its section title), the item panel, the cut line label (for example “Cut 4 to 3”), and the review labels in the walkthrough.',
'The order itself is unchanged: the item listed first is still cut first. Only the numbers shown changed.',
'The sample export pictures on the business pitch page were regenerated to match.']},
{n:16,date:'Nov 19, 2026',title:'Create Project button moved',items:[
'Moved the Create Project button into the header bar, next to the Changelog button.',
'It is white with black text.',
'It appears on the Projects screen. The buttons that used to sit in the page body were removed, and the empty-state prompt now points to the header button.']},
{n:15,date:'Nov 19, 2026',title:'Changelog added',items:[
'Added a Changelog button on the right side of the header bar.',
'The page lists every update to the tool, newest first, with the date of each.',
'Earlier updates were filled in from our conversation, so the earlier dates are the day each change was made.']},
{n:14,date:'Nov 19, 2026',title:'Discipline tags removed',items:[
'Removed “Disciplines involved” from every item form: MVP requirements, Nice to Have, the review cards, the Step 6 editor, and the item panel on the map.',
'Removed the “I work in” filter bar and the dimming it caused on the map and tiles.',
'Removed discipline chips from feature tiles and the discipline dropdown from subtasks.',
'Removed the “Every item has a discipline” check above the map.',
'Removed the Disciplines column from the PDF breakdown.',
'The cut line now shows the hours a cut frees instead of the disciplines it touches.']},
{n:13,date:'Nov 19, 2026',title:'Step 4 and Step 6',items:[
'Nice to Have items now use the same full form as MVP requirements: name, Definition of Done, status, estimated hours, assigned to, and needs to be in the know. Added items show as short rows with Edit and Remove.',
'Removed the cut-order numbers from the circle labels on the map, the walkthrough preview, and the PDF circle. The key now says “Nice to have”.',
'Step 6: clicking the bullseye shows its details (Feature, Identity Tag, Definition of Done, Feature Owner), the same way the other sections show theirs.']},
{n:12,date:'Nov 19, 2026',title:'Step 2: Feature MVP Requirements',items:[
'Retitled the step “Feature MVP Requirements” with the description “These items must be complete for [your feature] to be considered MVP Complete.”',
'Each requirement is added through a full form: name, Definition of Done, status, estimated hours, assigned to, needs to be in the know, and disciplines.',
'The form shows the item’s next code. Added requirements show as short rows with Edit and Remove.',
'Clicking Next with an unfinished requirement shows a message instead of losing it.']},
{n:11,date:'Nov 19, 2026',title:'Identity Tag and item codes',items:[
'New Identity Tag box in Step 1, under Feature and above Definition of Done, with the description “Melee combat -> MCOM”.',
'The tag is required, uses letters and numbers only, and must be unique within a project.',
'Every item gets a consecutive code (MCOM-1, MCOM-2, and so on). Nice to have items continue the count. A code never changes when items are reordered or moved.',
'Codes show in the walkthrough lists, the item panel, feature tiles, and the PDF breakdown.',
'The tag can be edited later by clicking the bullseye on the map.']},
{n:10,date:'Nov 19, 2026',title:'Epics removed',items:[
'Removed Create Epic, the epic walkthrough, linking features to epics, and the roll-up from linked features, to be reworked later.',
'Kept the Step 1 changes. “Make this its own feature” still works, but the slice’s status and hours are independent of the new map.']},
{n:9,date:'Nov 19, 2026',title:'Step 1 rework',items:[
'Retitled Step 1 “What is your feature?” with the description “The bullseye is the feature you want to add.”',
'Renamed the first box “Feature” and changed the example text to “Melee Combat”.',
'Removed “(optional)” from the Definition of Done label.',
'Added a Feature Owner box: “Who will be responsible for seeing this feature through production?” The owner shows on the map’s bullseye panel and at the top of the PDF.']},
{n:8,date:'Nov 19, 2026',title:'Epics (later removed)',items:[
'Added a Create Epic button next to Add Feature, with its own walkthrough.',
'Features could be linked to an epic from either side, with status and hours rolling up from the linked feature.',
'Removed again in update 10.']},
{n:7,date:'Nov 18, 2026',title:'Subtasks',items:[
'Items can have subtasks, each with a name, assigned to, hours, and status.',
'When an item has subtasks, its hours and status come from them.',
'The PDF breakdown lists subtasks under their item.']},
{n:6,date:'Nov 18, 2026',title:'PDF export and new item fields',items:[
'Added an Export PDF button on every Bullseye map.',
'Page 1 is the map with the feature’s Definition of Done and a summary of counts and hours. The pages after it are a breakdown of every item.',
'Items gained estimated hours, assigned to, and needs to be in the know. Tiles and the map show the hour totals.']},
{n:5,date:'Nov 18, 2026',title:'Settings page',items:[
'Settings is now its own page for a project: project name, GDD address, share link, and delete project.',
'Removed the Add Feature buttons from the Settings page.']},
{n:4,date:'Nov 18, 2026',title:'Start Project step',items:[
'After the share screen there is now a third step with a Start Project button.',
'Start Project opens the project’s main page, which has the Add Feature button.']},
{n:3,date:'Nov 18, 2026',title:'Review steps and edit rights',items:[
'The Add Feature walkthrough became six steps, with a review of each item’s Definition of Done, status, and who works on it before moving to the outer circle, and again after it.',
'On the final map step, any section can be clicked and edited before adding the map.',
'The project owner can always edit every item.']},
{n:2,date:'Nov 18, 2026',title:'Renamed to Bullseye Method with a guided start',items:[
'Renamed the tool the Bullseye Method.',
'New flow: Create a new project?, name the project, optional share step, then a blank page with Add Feature.',
'Add Feature walkthrough: the bullseye first, then the inner circle of requirements, then Nice to Have Features, then the full map and Add Bullseye Map.',
'Each map becomes a tile with a progress bar. Items and the bullseye got a Definition of Done box.']},
{n:1,date:'Nov 18, 2026',title:'First version',items:[
'A shared app with feature maps: a red bullseye, a yellow inner circle of must-haves, and a green outer circle of nice-to-haves.',
'A tile index of maps, status marks on the circle, and a cut line slider.',
'A GDD link for each item, and “Make this its own feature” for a second layer of maps. No third layer of circles.']}
];
function openChangelog(){const bk={page:V.page==='changelog'?(V.back||'projects'):V.page};V.back=bk.page;nav('changelog')}
function closeChangelog(){V.page=V.back&&V.back!=='changelog'?V.back:'projects';V.key='';V.force=true;render()}
function toggleChangelog(){if(V.page==='changelog')closeChangelog();else openChangelog()}
function fbRebuild(){const out={};Object.keys(S.fbRaw).forEach(function(u){(S.fbRaw[u]||[]).forEach(function(it){const k=u+'.'+it.id;if(S.fbState.gone[k])return;out[k]=Object.assign({},it,{uid:u,status:S.fbState.done[k]?'done':'new'})})});S.fb=out}
function fbNew(){return Object.keys(S.fb).filter(function(k){return S.fb[k].status!=='done'}).length}
function menuFeedback(){V.menuOpen=false;nav('feedback')}
function fbCtx(){
const p=proj(),f=V.fid&&S.features[V.fid],e=V.eid&&S.epics[V.eid];
return {page:V.page,project:p?p.name:'',epic:e?e.name:'',feature:f?f.name:'',size:innerWidth+'x'+innerHeight,v:CHANGELOG[0].n,ua:String(navigator.userAgent||'').slice(0,140)}}
function fbOpen(type){
V.menuOpen=false;renderTop();
const bug=type==='bug',d=$('fbdlg');
d.dataset.type=type;
const blocked=!(db&&canWrite&&S.perm);
d.innerHTML='<h2 id="fbt" style="font-size:18px;font-weight:500;margin:0 0 6px">'+(bug?'Report a bug':'Make a suggestion')+'</h2><p class="hint" style="margin:0 0 4px">'+(bug?'Tell us what went wrong. We’ll attach the screen you were on and your window size.':'Tell us what would make this better. We’ll note the screen you were on.')+'</p>'+(blocked?'<p class="ferr" style="margin:8px 0 0">You have view-only access, so this can’t be saved from here.</p>':'')+'<div class="f"><label for="fb1">'+(bug?'What happened?':'What’s your idea?')+'</label><textarea id="fb1"'+(blocked?' disabled':'')+'></textarea></div><div class="f"><label for="fb2">'+(bug?'What did you expect to happen? (optional)':'How would it help? (optional)')+'</label><textarea id="fb2"'+(blocked?' disabled':'')+'></textarea></div><div class="f"><label for="fbn">Your name or email, if you’d like a reply (optional)</label><input id="fbn" maxlength="120"'+(blocked?' disabled':'')+'></div><div class="acts"><button type="button" class="btn pri" onclick="fbSend()"'+(blocked?' disabled':'')+'>'+(bug?'Send bug report':'Send suggestion')+'</button><button type="button" class="btn" onclick="fbClose()">Cancel</button></div>';
if(!d.dataset.bound){d.dataset.bound='1';d.addEventListener('close',function(){const b=$('menubtn');if(b)b.focus()})}
d.showModal();
const f1=$('fb1');if(f1&&!blocked)f1.focus()}
function fbClose(){const d=$('fbdlg');if(d.open)d.close()}
async function fbSend(){
const d=$('fbdlg'),type=d.dataset.type;
const t=($('fb1').value||'').trim();
if(!t){wizErr(type==='bug'?'Tell us what went wrong first.':'Write your idea first.','fb1');return}
const x=($('fb2').value||'').trim(),n=($('fbn').value||'').trim();
const id='fb-'+Date.now().toString(36)+'-'+rand();
const doc={id:id,type:type,text:t.slice(0,4000),extra:x.slice(0,4000),contact:n,ctx:fbCtx(),created:Date.now()};
const ok=await w(async function(){const ref=rawDb.doc('feedback/'+uid);const s=await ref.get();const cur=(s.exists&&s.data()&&s.data().items)||[];cur.push(doc);await ref.set({items:cur})});
if(ok){fbClose();say(type==='bug'?'Thanks. Your bug report was sent.':'Thanks. Your suggestion was sent.')}}
function fbFilter(f){V.fbFilter=f;V.confirm='';V.force=true;render()}
function fbSaveState(done,gone){return w(function(){return rawDb.doc('fbstate/inbox').set({done:done,gone:gone})})}
function fbMark(k){const done=Object.assign({},S.fbState.done);if(done[k])delete done[k];else done[k]=true;return fbSaveState(done,S.fbState.gone)}
async function fbDel(k){const gone=Object.assign({},S.fbState.gone);gone[k]=true;const ok=await fbSaveState(S.fbState.done,gone);if(ok){V.confirm='';V.force=true;render()}}
function fbCtxLine(c){if(!c)return '';const pg={projects:'Home',project:'Project page',map:'Map',order:'Ordering screen',wizard:'Add Feature walkthrough',epic:'Epic page',newepic:'Create epic',settings:'Settings',changelog:'Changelog',newproject:'New project',share:'Share step',start:'Start'}[c.page]||c.page;return [pg,c.feature,c.epic,c.project,c.size,c.v?'version '+c.v:''].filter(Boolean).join(' · ')}
function buildFeedback(){
if(!isOwner){$('app').innerHTML='<div class="head"><h1>Feedback inbox</h1></div><p class="hint">Only the owner and editors can read feedback.</p>';return}
const f=V.fbFilter||'all';
const all=Object.keys(S.fb).sort(function(a,b){return (S.fb[b].created||0)-(S.fb[a].created||0)});
const list=all.filter(function(k){const s=S.fb[k];return f==='all'||(f==='new'&&s.status!=='done')||(f==='bug'&&s.type==='bug')||(f==='idea'&&s.type==='idea')});
const tab=function(k,t){return '<button class="btn sm'+(f===k?' pri':'')+'" aria-pressed="'+(f===k)+'" onclick="fbFilter(\''+k+'\')">'+t+'</button>'};
let h='<div class="head"><h1>Feedback inbox</h1><div class="sp"></div><button class="btn" onclick="nav(\'projects\')">Back</button></div><p class="hint" style="margin:0 0 12px">Bug reports and suggestions from everyone who uses the tool, newest first. '+all.length+' so far, '+fbNew()+' not marked done.</p><div class="acts" style="margin:0 0 14px">'+tab('all','All ('+all.length+')')+tab('new','Open ('+fbNew()+')')+tab('bug','Bugs ('+all.filter(function(k){return S.fb[k].type==='bug'}).length+')')+tab('idea','Suggestions ('+all.filter(function(k){return S.fb[k].type==='idea'}).length+')')+'</div>';

central\" style=\"font-size:26px;font-weight:500\">Feature</text><defs><radialGradient id=\"hpg1\" gradientUnits=\"userSpaceOnUse\" cx=\"210\" cy=\"210\" r=\"1\"><stop offset=\"0\" style=\"stop-color:var(--bg);stop-opacity:0\"><animate attributeName=\"offset\" begin=\"indefinite\" dur=\"1.9s\" fill=\"freeze\" calcMode=\"linear\" keyTimes=\"0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000\" values=\"0.0000;0.0000;0.0000;0.0000;0.0000;0.0000;0.0000;0.0000;0.0898;0.1909;0.2718;0.3380;0.3932;0.4399;0.4799;0.5146;0.5449;0.5717;0.5955;0.6168\"/></stop><stop offset=\"1\" style=\"stop-color:var(--bg);stop-opacity:1\"/><animate attributeName=\"r\" begin=\"indefinite\" dur=\"1.9s\" fill=\"freeze\" calcMode=\"linear\" keyTimes=\"0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000\" values=\"1.00;8.24;16.48;24.72;32.96;41.20;49.44;57.68;65.92;74.16;82.40;90.64;98.88;107.12;115.36;123.60;131.84;140.08;148.32;156.56\"/></radialGradient></defs><rect class=\"hp-cover\" x=\"0\" y=\"0\" width=\"420\" height=\"420\" style=\"fill:url(#hpg1)\"/><circle class=\"hp-fpulse\" cx=\"210\" cy=\"210\" r=\"206\" style=\"fill-opacity:.07;stroke-width:5;vector-effect:non-scaling-stroke\"/></svg></div>\n</div>\n</section>\n<section class=\"hp-sec hp-flip\" id=\"hphow2\" aria-labelledby=\"hp2h\">\n<div class=\"hp-wrap\">\n<div class=\"hp-txt\">\n<div class=\"hp-kicker\"><b>2</b>The Must-Haves</div>\n<h2 class=\"hp-hd\" id=\"hp2h\">Surround the feature with its must-haves.</h2>\n<p>Must-haves establish the minimum requirements for a feature to deliver its intended purpose. Defining them keeps development focused on core functionality, ensuring the feature is playable and testable before additional time and resources are invested.</p>\n<p>Identify the must-have elements your feature needs to function, focusing only on the essentials required to make it playable, testable, and ready for MVP evaluation.</p>\n<div class=\"hp-fields\">\n<h3>You\u2019ll fill in for each must-have</h3>\n<dl>\n<dt>Name</dt><dd>A plain-language name for the must-have.</dd>\n<dt>Definition of Done</dt><dd>How the team will know it is finished.</dd>\n<dt>Status</dt><dd>Not started, In progress, or Done.</dd>\n<dt>Estimated hours</dt><dd>How long you expect it to take.</dd>\n<dt>Assigned to</dt><dd>Who is doing the work.</dd>\n<dt>Needs to be in the know</dt><dd>Who should be kept informed.</dd>\n</dl>\n</div>\n</div>\n<div class=\"hp-vis\"><svg class=\"hp-must\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The Feature bullseye with four Must Haves around it. A pulse travels out from the center, red inside the bullseye and yellow once it crosses into the Must Haves, and the Must Have circle fades in behind it.\" xmlns=\"http://www.w3.org/2000/svg\"><title>The Feature with its Must Haves</title><desc>A red Feature circle in the center surrounded by a yellow circle divided into four Must Have slices. A single pulse travels out from the center, red inside the bullseye and then yellow once it crosses into the Must Haves, and the yellow circle fades in softly behind the pulse as it goes.</desc><defs><radialGradient id=\"hpfade\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0.38710\" style=\"stop-color:var(--bg);stop-opacity:0\"/><stop offset=\"0.61290\" style=\"stop-color:var(--bg);stop-opacity:1\"/></radialGradient></defs><g class=\"hp-ringg\"><circle cx=\"200\" cy=\"200\" r=\"190\" style=\"fill:var(--abg);stroke:var(--abd);stroke-width:1\"/><line x1=\"141.3\" y1=\"141.3\" x2=\"65.6\" y2=\"65.6\" style=\"stroke:var(--abd);stroke-width:1\"/><line x1=\"258.7\" y1=\"141.3\" x2=\"334.4\" y2=\"65.6\" style=\"stroke:var(--abd);stroke-width:1\"/><line x1=\"258.7\" y1=\"258.7\" x2=\"334.4\" y2=\"334.4\" style=\"stroke:var(--abd);stroke-width:1\"/><line x1=\"141.3\" y1=\"258.7\" x2=\"65.6\" y2=\"334.4\" style=\"stroke:v let hpIO=null;
function hpStart(svg){svg.classList.remove('hp-hide');svg.querySelectorAll('animate').forEach(function(a){try{a.beginElement()}catch(e){}});svg.classList.add('go')}
function hpReset(svg){svg.classList.remove('go');svg.classList.remove('done');svg.classList.add('hp-hide')}
function hpWatch(){
if(hpIO){hpIO.disconnect();hpIO=null}
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce||!('IntersectionObserver' in window))return;
const smil=typeof SVGAnimationElement!=='undefined';
const svgs=Array.prototype.slice.call(document.querySelectorAll('#hphow2 .hp-must,#hphow3 .hp-full'+(smil?',.hp-hero .hp-map,#hphow .hp-feat':'')));
if(!svgs.length)return;
svgs.forEach(function(svg){const cv=svg.querySelector('.hp-cover');svg.classList.add('hp-prep');if(cv)cv.addEventListener('animationend',function(){svg.classList.add('done')})});
hpIO=new IntersectionObserver(function(es){es.forEach(function(e){
const svg=e.target;
if(e.isIntersecting&&e.intersectionRatio>=0.1){if(!svg.classList.contains('go'))hpStart(svg)}
else if(!e.isIntersecting)hpReset(svg)})},{threshold:[0,0.1]});
svgs.forEach(function(s){hpIO.observe(s)})}

function paintMapLeft(){
const f=S.features[V.fid];if(!f||!$('svgbox'))return;
const y=itemsOf(V.fid,'y'),g0=itemsOf(V.fid,'g'),gk=keptOf(g0),gc=cutOf(g0),g=gk.concat(gc);
if(V.cut>gk.length)V.cut=gk.length;
const all=y.concat(gk);
const dodN=all.filter(function(s){return String(s.dod||'').trim()}).length+(String(f.dod||'').trim()?1:0);
const dodT=all.length+1;
const mvpDone=y.filter(function(s){return effStatus(s)==='done'}).length;
const mvpTxt=y.length&&mvpDone===y.length?'MVP complete':'MVP: '+mvpDone+' of '+y.length+' must-haves done';
const checks=[
[y.length<=8,y.length<=8?'Must-haves: '+y.length:'Must-haves: '+y.length+'. Eight or fewer reads best'],
[gk.length<=12,gk.length<=12?'Nice to have: '+gk.length:'Nice to have: '+gk.length+'. Twelve or fewer reads best']];
$('checks').innerHTML=checks.map(function(c){return '<span class="pill '+(c[0]?'ok':'warn')+'">'+(c[0]?'✓ ':'! ')+esc(c[1])+'</span>'}).join('')+'<span class="pill'+(dodN===dodT?' ok':'')+'">'+(dodN===dodT?'✓ ':'')+'Definition of Done: '+dodN+' of '+dodT+' written</span>'+'<span class="pill">Estimated: '+fmtH(hoursOf(y))+' h must-haves, '+fmtH(hoursOf(gk))+' h nice to have'+(unestOf(all)?' ('+unestOf(all)+' without hours)':'')+'</span><span class="pill">'+mvpTxt+'</span>'+(gc.length?'<span class="pill">Cut: '+gc.length+' item'+(gc.length>1?'s':'')+', '+fmtH(hoursOf(gc))+' h freed</span>':'');
$('svgbox').innerHTML=mapSvg(f.name,y,g,{click:true,sel:V.sel,fade:gk.slice(gk.length-V.cut).map(function(s){return s.id}),tag:'feature'});
const r=$('cutr');r.max=gk.length;r.value=V.cut;
$('cutlab').textContent=V.cut?'Cut '+gk.length+(V.cut>1?' to '+(gk.length-V.cut+1):''):'Nothing cut';
const cutL=gk.slice(gk.length-V.cut);const cutH=hoursOf(cutL);
$('cutinfo').innerHTML=V.cut?'Cutting '+V.cut+' item'+(V.cut>1?'s':'')+' frees '+fmtH(cutH)+' h'+(unestOf(cutL)?' ('+unestOf(cutL)+' without hours)':'')+'. Must-haves are untouched.':'Drag to see how many hours a cut frees.';
const ca=$('cutact');if(ca)ca.innerHTML=cutActHtml(V.cut);
const cf=$('cf');if(cf)cf.textContent=f.name}
function addCard(dis){return '<div class="card" style="margin-top:12px"><div class="f" style="margin-top:0"><label for="newname">Add to this map</label><input id="newname" placeholder="Name it in plain language" onkeydown="if(event.key===\'Enter\')addItem(\'y\')"'+dis+'></div><div class="acts" style="margin-top:8px"><button class="btn sm" onclick="addItem(\'y\')"'+dis+'>Add must-have</button><button class="btn sm" onclick="addItem(\'g\')"'+dis+'>Add nice to have</button></div></div>'}
function paintPanel(force){

const a=document.activeElement;
if(!force&&a&&el.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){V.dirty=true;return}
const f=S.features[V.fid];if(!f)return;
const dis=canWrite?'':' disabled';

if(V.sel&&V.sel!=='center'&&(!s||s.featureId!==V.fid))V.sel='';
const layer=layerOf(V.fid);
let h='<div class="card">';
if(!s){
const y=itemsOf(V.fid,'y');const done=y.filter(function(x){return effStatus(x)==='done'}).length;
h+='<div class="hint">The bullseye</div><div class="f" style="margin-top:4px"><input id="fn" value="'+esc(f.name)+'" style="font-size:17px;font-weight:500" onchange="renameFeature(this.value)"'+dis+' aria-label="Main feature"></div><div class="f"><label for="ft">Identity Tag</label><input id="ft" value="'+esc(f.tag||'')+'" maxlength="8" onchange="setFeatureTag(this.value)"'+dis+'></div><div class="f"><label for="fo">Feature Owner</label><input id="fo" value="'+esc(f.owner||'')+'" placeholder="Name" onchange="setFeatureOwner(this.value)"'+dis+'></div><div class="f"><label for="fd">Definition of Done for this feature</label><textarea id="fd" onchange="setFeatureDod(this.value)" placeholder="How will we know this feature is finished?"'+dis+'>'+esc(f.dod||'')+'</textarea></div><p class="hint" style="margin:10px 0 0">'+mvpLine()+' Click a section of the map to edit it.</p><div class="acts">'+(V.confirm==='f'?'<button class="btn sm danger" onclick="delFeature()">Confirm delete feature</button><button class="btn sm ghost" onclick="ask(\'f\')">Cancel</button>':'<button class="btn sm ghost" onclick="ask(\'f\')"'+dis+'>Delete this feature</button>')+'</div>'}
else{
const url=gddUrl(s);const sid=s.id;
const gs=keptOf(itemsOf(V.fid,'g'));

h+='<div class="hint">'+(keyOf(f,s)?esc(keyOf(f,s))+' · ':'')+ring+'</div><div class="f" style="margin-top:4px"><input id="sn" value="'+esc(s.name)+'" style="font-size:17px;font-weight:500" onchange="renameItem(\''+sid+'\',this.value)"'+dis+' aria-label="Name"></div>';
if(s.cut)h+='<div class="card" style="padding:10px;margin:8px 0"><div style="font-size:14px">This item was cut on '+esc(fmtDate(s.cutOn))+'. It no longer counts toward the hours.</div><div class="acts" style="margin-top:8px"><button class="btn sm pri" onclick="restoreCut(\''+sid+'\')"'+dis+'>Restore to the map</button></div></div>';
h+=summaryHtml(s,sid,dis);
h+='<div class="psec"><h3>Definition of Done</h3><textarea id="sd" aria-label="Definition of Done" onchange="updItem(\''+sid+'\',{dod:this.value})" placeholder="How will we know this is finished?"'+dis+'>'+esc(s.dod||'')+'</textarea></div>';
h+=subsHtml(s,dis);
h+='<div class="psec"><h3>People</h3><div class="f" style="margin-top:0"><label for="sa">Assigned to</label><input id="sa" value="'+esc(s.assignee||'')+'" placeholder="Names" onchange="updItem(\''+sid+'\',{assignee:this.value.trim()})"'+dis+'></div><div class="f"><label for="si">Needs to be in the know</label><input id="si" value="'+esc(s.informed||'')+'" placeholder="Names or teams" onchange="updItem(\''+sid+'\',{informed:this.value.trim()})"'+dis+'></div></div>';
h+='<div class="psec"><h3>Design document</h3><div class="hint" style="margin-bottom:4px">'+esc(gddPath(s))+'</div>'+(url?'<a class="gl" href="'+esc(url)+'" target="_blank" rel="noopener">Open this page in the GDD</a>':'<span class="hint">Set the GDD address in project settings, or paste a link below.</span>')+'<input id="sg" style="margin-top:8px" value="'+esc(s.gdd||'')+'" placeholder="Optional: paste a specific link" onchange="updItem(\''+sid+'\',{gdd:this.value})"'+dis+' aria-label="Link to a specific GDD page"></div>';
const list=s.ring==='g'?keptOf(itemsOf(V.fid,'g')):itemsOf(V.fid,'y');const idx=list.findIndex(function(x){return x.id===sid});
h+='<details class="psec more" ontoggle="V.moreOpen=this.open"'+((V.moreOpen||V.confirm==='i:'+sid)?' open':'')+'><summary>More actions</summary><div class="acts"><button class="btn sm" onclick="moveItem(\''+sid+'\',-1)"'+((s.cut||idx<=0)?' disabled':'')+dis+'>Move up</button><button class="btn sm" onclick="moveItem(\''+sid+'\',1)"'+((s.cut||idx>=list.length-1)?' disabled':'')+dis+'>Move down</button><button class="btn sm" onclick="switchRing(\''+sid+'\')"'+dis+'>Move to '+(s.ring==='y'?'nice to have':'must-haves')+'</button>';
if(s.child&&S.features[s.child])h+='<button class="btn sm pri" onclick="openMap(\''+s.child+'\')">Open its Bullseye map</button>';
h+='</div><div class="acts" style="margin-top:8px">'+(V.confirm==='i:'+sid?'<button class="btn sm danger" onclick="delItem(\''+sid+'\')">Confirm delete</button><button class="btn sm ghost" onclick="ask(\'i:'+sid+'\')">Cancel</button>':'<button class="btn sm ghost" onclick="ask(\'i:'+sid+'\')"'+dis+'>Delete item</button>')+'</div></details>'}
h+='</div>'+addCard(dis);
el.innerHTML=h;V.dirty=false}
const fmtH=function(n){return String(Math.round(n*10)/10)};
function hrs(it){if(it.hours===undefined||it.hours==='')return 0;const n=Number(it.hours);return isFinite(n)?n:0}
function hoursOf(list){return list.reduce(function(t,s){return t+effHours(s)},0)}
function unestOf(list){return list.filter(function(s){return !hasHours(s)}).length}
function keptOf(list){return list.filter(function(s){return !s.cut})}
function cutOf(list){return list.filter(function(s){return s.cut})}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return '';return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function subsOf(it){return it&&Array.isArray(it.subs)?it.subs:[]}
function hasHours(it){const sb=subsOf(it);if(sb.length)return sb.some(function(x){return x.hours!==undefined&&x.hours!==''});return it.hours!==undefined&&it.hours!==''}
function effHours(it){const sb=subsOf(it);if(sb.length)return sb.reduce(function(t,x){return t+hrs(x)},0);return hrs(it)}
function effStatus(it){const sb=subsOf(it);if(!sb.length)return it.status||'todo';if(sb.every(function(x){return x.status==='done'}))return 'done';if(sb.some(function(x){return x.status==='done'||x.status==='doing'}))return 'doing';return 'todo'}
async function saveSubs(id,arr){const ok=await updItem(id,{subs:arr});if(ok){S.items[id]=Object.assign({},S.items[id],{subs:arr});paintMapLeft()}return ok}
function setSub(id,sid,field,v){const it=S.items[id];if(!it)return;let val=v;
if(field==='hours')val=v===''?'':Math.max(0,+v||0);
if(field==='name'){val=String(v).trim();if(!val){paintPanel(true);return}}
if(field==='assignee')val=String(v).trim();
const arr=subsOf(it).map(function(x){if(x.id!==sid)return x;const o=Object.assign({},x);o[field]=val;return o});saveSubs(id,arr)}
async function addSub(id){const el=$('subname');const name=el.value.trim();if(!name){say('Name the subtask first.');return}
const dv=($('subdep')||{}).value||'';const who=((($('subwho')||{}).value)||'').trim();const hv=($('subhrs')||{}).value;const hrsv=(hv===undefined||hv==='')?'':Math.max(0,+hv||0);const patch=newSubPatch(S.items[id],name,hrsv,dv,who);
const ok=await updItem(id,patch);if(ok){S.items[id]=Object.assign({},S.items[id],patch);paintMapLeft();paintPanel(true);const n=$('subname');if(n)n.focus()}}
function delSub(id,sid){saveSubs(id,subsOf(S.items[id]).filter(function(x){return x.id!==sid})).then(function(){paintPanel(true)})}
function summaryHtml(s,sid,dis){
const sb=subsOf(s);
if(sb.length){const d=sb.filter(function(x){return x.status==='done'}).length;const pct=Math.round(d/sb.length*100);
return '<div class="psum"><div class="pb" aria-hidden="true"><i style="width:'+pct+'%"></i></div><div class="row"><span>'+d+' of '+sb.length+' subtasks done · '+({todo:'Not started',doing:'In progress',done:'Done'}[effStatus(s)])+'</span><span>'+fmtH(effHours(s))+' h</span></div></div>'}
return '<div class="psum"><div class="str" style="margin-top:0"><div><label for="ss" class="mini">Status</label><select id="ss" onchange="updItem(\''+sid+'\',{status:this.value})"'+dis+'>'+[['todo','Not started'],['doing','In progress'],['done','Done']].map(function(o){return '<option value="'+o[0]+'"'+(s.status===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div><div><label for="sh" class="mini">Estimated hours</label><input id="sh" type="number" min="0" step="0.5" value="'+esc(s.hours===undefined?'':s.hours)+'" onchange="updItem(\''+sid+'\',{hours:this.value===\'\'?\'\':Math.max(0,+this.value||0)})"'+dis+'></div></div></div>'}
function subsHtml(s,dis){
const sb=subsOf(s),sid=s.id;
const enter='onkeydown="if(event.key===\'Enter\')addSub(\''+sid+'\')"';
let h='<div class="psec"><h3>Subtasks'+(sb.length?' · '+sb.length:'')+'</h3>';
h+='<div class="hint" style="margin-bottom:8px">'+(sb.length?'Each developer tracks their own work here. A dependency is another subtask that must be finished before this one can continue.':'Break this item into smaller pieces of work so each developer can track their part. A dependency is another subtask that must be finished first.')+'</div>';
h+=sb.map(function(x){return '<div class="st"><div class="stl"><select onchange="setSub(\''+sid+'\',\''+x.id+'\',\'status\',this.value)"'+dis+' aria-label="Subtask status">'+[['todo','Not started'],['doing','In progress'],['done','Done']].map(function(o){return '<option value="'+o[0]+'"'+(x.status===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><input value="'+esc(x.name)+'" onchange="setSub(\''+sid+'\',\''+x.id+'\',\'name\',this.value)"'+dis+' aria-label="Subtask name"><button class="btn sm ghost" onclick="delSub(\''+sid+'\',\''+x.id+'\')"'+dis+'>Remove</button></div><div class="str"><input value="'+esc(x.assignee||'')+'" placeholder="Assigned to" onchange="setSub(\''+sid+'\',\''+x.id+'\',\'assignee\',this.value)"'+dis+' aria-label="Subtask assigned to"><input type="number" min="0" step="0.5" value="'+esc(x.hours===undefined?'':x.hours)+'" placeholder="Hours" onchange="setSub(\''+sid+'\',\''+x.id+'\',\'hours\',this.value)"'+dis+' aria-label="Subtask hours"></div><div class="sdep"><div class="dline"><span class="hint">Depends on</span>'+(depChips(sid+':'+x.id,false)||'<span class="hint">nothing yet</span>')+'</div>'+depSelect(sid+':'+x.id,x.name)+'</div></div>'}).join('');

const cutsHtml=m.cuts.length?'<div class="rl" style="margin-top:18px">Cut · '+m.cuts.length+' item'+(m.cuts.length>1?'s':'')+'</div><ul class="olist">'+m.cuts.map(function(c){return '<li class="orow cutrow" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="oname">'+esc(c.name)+'</span><span class="ohrs">'+(c.hours===null?'no hours':fmtH(c.hours)+' h')+' · cut '+esc(fmtDate(c.on))+'</span>'+(canWrite?'<button type="button" class="btn sm" onclick="restoreCut(\''+c.k+'\')">Restore</button>':'<span></span>')+'</li>'}).join('')+'</ul>':'';
if(n<2)return core+'<p class="hint" style="margin-top:14px">'+(n===0?'There are no nice-to-haves left to order.':'There is only one nice-to-have left, so there’s nothing to reorder.')+'</p>'+cutsHtml;
const cut=Math.min(V.cut,n);const parts=[];
m.items.forEach(function(it,i){if(i===n-cut)parts.push(ordBar());parts.push(ordRow(it))});
if(cut===0)parts.push(ordBar());
return core+'<div class="rail"><div class="rl">Closest to the must-haves</div><ul class="olist" id="olist">'+parts.join('')+'</ul><div class="rl">Furthest from the core feature: cut first</div></div><div id="ocutact"></div>'+cutsHtml}
function ordRefresh(){
const list=$('olist');if(!list)return 0;
let num=0,cutN=0,freed=0,unest=0,seen=false;
Array.prototype.forEach.call(list.children,function(li){
if(li.classList.contains('obar')){seen=true;return}
num++;li.querySelector('.onum').textContent=num;li.classList.toggle('cutrow',seen);
if(seen){cutN++;if(li.dataset.h==='')unest++;else freed+=Number(li.dataset.h)}});
const oa=$('ocutact');if(oa&&V.page==='order')oa.innerHTML=cutActHtml(cutN);
const o=$('ofree');if(o)o.textContent=cutN?('cutting '+cutN+' item'+(cutN>1?'s':'')+' frees '+fmtH(freed)+' h'+(unest?' ('+unest+' without hours)':'')):'drag it up to see what a cut frees';
return cutN}
function ordCommit(fk){
const list=$('olist');if(!list)return;
const cutN=ordRefresh();V.cut=cutN;V.cutAsk=false;
const keys=Array.prototype.filter.call(list.children,function(li){return !li.classList.contains('obar')}).map(function(li){return li.dataset.k});
if(V.page==='order'){
if(!canWrite){say('You can look around, but you can’t edit this.');buildOrder();return}
const changed=[];keys.forEach(function(k,i){const it=S.items[k];if(it&&it.order!==i+1)changed.push([k,i+1])});
changed.forEach(function(c){S.items[c[0]]=Object.assign({},S.items[c[0]],{order:c[1]})});
if(changed.length)w(async function(){for(const c of changed){await db.doc('items/'+c[0]).update({order:c[1]})}});
}else{
W.g=keys.map(function(k){return W.g[+k]});
const nk=fk&&fk!=='bar'?String(keys.indexOf(fk)):fk;
const wr=$('ordwrap');if(wr){wr.innerHTML=ordHtml();ordBind()}
drawWiz();V.ofocus=nk}}
function ordRestoreFocus(){
if(V.ofocus===null||V.ofocus===undefined)return;
const el=document.querySelector('#olist [data-k="'+V.ofocus+'"] .grip');V.ofocus=null;if(el)el.focus()}
function ordBind(){
const list=$('olist');if(!list)return;
list.addEventListener('pointerdown',function(e){
const g=e.target.closest('.grip');if(!g)return;
const li=g.closest('li');e.preventDefault();
const pid=e.pointerId;V.dragging=true;li.classList.add('dragging');
const move=function(ev){
if(ev.pointerId!==pid)return;
const y=ev.clientY;let target=null;
const others=Array.prototype.filter.call(list.children,function(c){return c!==li});
for(let i=0;i<others.length;i++){const r=others[i].getBoundingClientRect();if(y<r.top+r.height/2){target=others[i];break}}
if(target){if(li.nextElementSibling!==target)list.insertBefore(li,target)}
else if(list.lastElementChild!==li)list.appendChild(li);
ordRefresh()};
const up=function(ev){
if(ev.pointerId!==pid)return;
document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
li.classList.remove('dragging');V.dragging=false;V.ofocus=null;ordCommit(li.dataset.k)};
document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)});
list.addEventListener('keydown',function(e){
if((e.key!=='ArrowUp'&&e.key!=='ArrowDown')||!e.target.classList||!e.target.classList.contains('grip'))return;
e.preventDefault();const li=e.target.closest('li');
const sib=e.key==='ArrowUp'?li.previousElementSibling:li.nextElementSibling;if(!sib)return;
if(e.key==='ArrowUp')list.insertBefore(li,sib);else list.insertBefore(sib,li);
V.ofocus=li.dataset.k;ordRefresh();ordCommit(li.dataset.k);ordRestoreFocus()});
ordRefresh();ordRestoreFocus()}
function openOrder(){nav('order')}
function backToMap(){V.page='map';V.key='';V.force=true;V.confirm='';render()}
function buildOrder(){
const f=S.features[V.fid];
$('app').innerHTML='<div class="crumb"><button onclick="nav(\'projects\')">Projects</button><span>›</span><button onclick="nav(\'project\')">'+esc((proj()||{}).name||'Project')+'</button>'+epicCrumb(epicKeyOf(V.fid))+'<span>›</span><button onclick="backToMap()">'+esc(f.name)+'</button><span>›</span><span style="color:var(--text);font-weight:500">Order nice-to-haves</span><span style="flex:1"></span><button class="btn sm" onclick="backToMap()">Back to the map</button></div><h1 style="font-size:22px">Order the nice-to-haves</h1><p class="hint" style="margin:4px 0 14px;max-width:560px">Drag a card up to bring it closer to the must-haves, or down to push it further away. Number 1 is the closest, and the cut starts at the highest number. Drag the cut line to see what each cut frees. When you’re sure, use Make this the cut to record it for the whole team.</p><div class="ord" id="ordwrap">'+ordHtml()+'</div>';
ordBind()}
function gate(){
if(V.page&&S.noDb){$('app').innerHTML='<div class="empty"><h1>Shared data isn’t available</h1><p class="hint">This page saves projects to a shared database, and this view can’t reach it. Open the page from the Claude app while signed in.</p></div>';return true}
if(S.err){$('app').innerHTML='<div class="empty"><h1>Couldn’t load your projects</h1><p class="hint">Reload the page. If it keeps happening, check that you still have access.</p></div>';return true}
if(!(S.p&&S.f&&S.i&&S.perm)){$('app').innerHTML='<p class="hint">'+(S.slow?'Still trying to reach the shared data. It may be out of date.':'Loading…')+'</p>';return true}
return false}
function render(){
renderTop();
const ap0=$('app');if(ap0)ap0.className=V.page==='projects'?'wrap home':'wrap';
if(V.page==='changelog'){buildChangelog();return}
if(V.page==='feedback'){V.key='feedback';V.force=false;buildFeedback();return}
if(V.page==='projects'&&!S.noDb&&!S.err){buildProjects();return}
if(gate())return;
if(V.page!=='projects'&&V.page!=='newproject'&&!proj()){V.page='projects';V.pid=null;V.key='';V.force=true}
if((V.page==='map'||V.page==='order')&&!S.features[V.fid]){V.page=V.eid&&S.epics[V.eid]?'epic':'project';V.key='';V.force=true}
if(V.page==='epic'&&!S.epics[V.eid]){V.page='project';V.key='';V.force=true}
const a=document.activeElement;
const typing=a&&$('app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='range';
if(V.page==='map'){
if(V.key!=='map:'+V.fid||V.force){V.key='map:'+V.fid;V.force=false;buildMap();return}
paintMapLeft();
if(typing)V.dirty=true;else paintPanel();
return}
if(V.page==='order'){if(V.dragging)return;V.key='order';V.force=false;buildOrder();return}
if(V.page==='wizard'){if(V.key!=='wizard:'+W.step||V.force){V.key='wizard:'+W.step;V.force=false;buildWizard()}return}
if(typing&&!V.force){V.dirty=true;return}
V.force=false;V.dirty=false;V.key=V.page;
if(V.page==='projects')buildProjects();
else if(V.page==='newproject')buildNewProject();
else if(V.page==='start')buildStart();
else if(V.page==='settings')buildSettings();
else if(V.page==='newepic')buildNewEpic();
else if(V.page==='epic')buildEpic();
else buildProject()}
document.addEventListener('focusout',function(){if(V.dirty)setTimeout(function(){V.force=V.page!=='map';render()},0)});
(async function(){
render();
let pu=null;
try{if(window.claude&&claude.use){pu=Promise.resolve(claude.use('user')).catch(function(){return null});rawDb=await claude.use('db')}}catch(e){}
if(!rawDb){S.noDb=true;render();return}
try{user=await pu}catch(e){user=null}
try{if(user&&typeof user.id==='function')uid=String(await user.id())}catch(e){}
db=makeStore(rawDb,uid);
const timer=setTimeout(function(){S.slow=true;say('Still trying to reach your data. This is taking longer than usual.');render()},10000);
const fail=function(e){S.err=(e&&e.code)||'error';clearTimeout(timer);render()};
const ready=function(){if(S.p&&S.f&&S.i)clearTimeout(timer)};
db.collection('projects').onSnapshot(function(snap){S.projects={};snap.docs.forEach(function(d){S.projects[d.id]=d.data()});S.p=true;ready();render()},fail);
db.collection('features').onSnapshot(function(snap){S.features={};snap.docs.forEach(function(d){S.features[d.id]=d.data()});S.f=true;ready();render()},fail);
db.collection('items').onSnapshot(function(snap){S.items={};snap.docs.forEach(function(d){S.items[d.id]=d.data()});S.i=true;ready();render()},fail);
db.collection('epics').onSnapshot(function(snap){S.epics={};snap.docs.forEach(function(d){S.epics[d.id]=d.data()});render()},function(){});
db.collection('drafts').onSnapshot(function(snap){S.drafts={};snap.docs.forEach(function(d){S.drafts[d.id]=d.data()});render()},function(){});
try{if(user){
const call=function(fn,arg){return typeof user[fn]==='function'?Promise.resolve(user[fn](arg)).catch(function(){return null}):Promise.resolve(null)};
const r=await Promise.all([call('isOwner'),call('canEdit'),call('can','data.write')]);
if(r[0]||r[1]){isOwner=true;canWrite=true}else if(r[2]===false)canWrite=false}}catch(e){}
S.perm=true;
if(isOwner){
rawDb.collection('feedback').onSnapshot(function(snap){S.fbRaw={};snap.docs.forEach(function(d){const x=d.data();S.fbRaw[d.id]=(x&&x.items)||[]});fbRebuild();render()},function(){});
rawDb.collection('fbstate').onSnapshot(function(snap){const x={done:{},gone:{}};snap.docs.forEach(function(d){if(d.id==='inbox'){const v=d.data()||{};x.done=v.done||{};x.gone=v.gone||{}}});S.fbState=x;fbRebuild();render()},function(){})}
render()
})();
</script>
<script>
// Offline support and updates. Only runs when hosted on its own (not inside Claude).
(function(){
if(!window.BULLSEYE_STANDALONE||!('serviceWorker' in navigator)||!window.isSecureContext)return;
let asked=false;
function offer(reg){
if(!reg.waiting||!navigator.serviceWorker.controller||document.getElementById('upd'))return;
const b=document.createElement('div');b.className='upd';b.id='upd';b.setAttribute('role','status');
b.innerHTML='<span>A new version is ready.</span><button type="button">Reload</button>';
b.querySelector('button').onclick=function(){asked=true;reg.waiting&&reg.waiting.postMessage('skipWaiting')};
document.body.appendChild(b)}
navigator.serviceWorker.addEventListener('controllerchange',function(){if(asked)location.reload()});
window.addEventListener('load',function(){
navigator.serviceWorker.register('sw.js').then(function(reg){
offer(reg);
reg.addEventListener('updatefound',function(){const n=reg.installing;if(n)n.addEventListener('statechange',function(){if(n.state==='installed')offer(reg)})});
setInterval(function(){reg.update().catch(function(){})},60*60*1000);
}).catch(function(e){console.warn('Service worker not registered',e)})})})();
</script>
